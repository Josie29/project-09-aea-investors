# Local Postgres for development and test only. Nothing here is used in production —
# the deployed app connects to a managed Postgres via DATABASE_URL.
#
#   docker compose up -d      start
#   docker compose down       stop (data survives in the named volume)
#   docker compose down -v    stop and destroy the data
services:
  postgres:
    image: postgres:17
    container_name: aea-onboarding-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aea_onboarding_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
