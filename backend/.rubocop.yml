# Omakase Ruby styling for Rails, with RSpec cops layered on top.
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# RuboCop 1.72+ loads extensions via `plugins:`, not `require:`.
plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable
  Exclude:
    - "db/schema.rb"
    - "bin/**/*"
    - "vendor/**/*"

# Default is 1, which does not survive contact with request specs: asserting the
# status code AND the response body is one logical check, and splitting it re-issues
# the same HTTP request per expectation for no diagnostic gain.
RSpec/MultipleExpectations:
  Max: 3

# Default is 5. Some specs construct their input inline -- OCR word fixtures with
# per-word confidences, multi-step request flows -- and hiding that setup behind a
# helper to satisfy a line count makes the test harder to read, not easier.
RSpec/ExampleLength:
  Max: 8
